<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brave Read Aloud — PDF Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
      background: #525659; color: #e0e0e0;
      min-height: 100vh; display: flex; flex-direction: column;
      overflow-y: auto;
    }
    #root { flex: 1; display: flex; flex-direction: column; }

    /* ---- PDF Text Layer CSS (adapted from pdf_viewer.css) ---- */

    .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1;
      z-index: 2;
      pointer-events: none;
    }

    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      pointer-events: auto;
    }

    /* Highlight — visible because we override color: transparent */
    .textLayer span.brave-tts-highlight {
      background-color: rgba(255, 213, 79, 0.55) !important;
      color: #000 !important;
      border-radius: 2px;
      z-index: 3;
    }

    /* Page container styling */
    .page-container {
      position: relative;
      margin: 8px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      background: #fff;
    }

    .page-container canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
