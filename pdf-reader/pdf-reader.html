<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brave Read Aloud — PDF Reader</title>
  <link rel="stylesheet" href="pdf_viewer.css" />
  <link rel="stylesheet" href="../content/content.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #525659; }
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: #1a1a2e; color: #fff; font-size: 13px;
    }
    #toolbar .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #toolbar button {
      background: #4361ee; color: #fff; border: none; border-radius: 6px;
      padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    #toolbar button:hover { background: #3a56d4; }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #viewer {
      margin-top: 44px; display: flex; flex-direction: column; align-items: center;
      padding: 16px;
    }
    .page-container {
      position: relative; margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3); background: #fff;
    }
    .page-container canvas { display: block; }
    .textLayer { opacity: 0.2; }
    .textLayer span { color: transparent; }
    #status-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #ccc; font-size: 15px; pointer-events: none; z-index: 200;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="title" id="pdf-title">Loading...</span>
    <span id="page-info"></span>
    <button id="btn-prev">◀</button>
    <button id="btn-next">▶</button>
  </div>
  <div id="viewer"></div>
  <div id="status-overlay">Loading PDF…</div>
  <script src="pdf.min.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../content/content.js"></script>
  <script src="pdf-reader.js"></script>
</body>
</html>
